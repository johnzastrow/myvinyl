{% extends "base.html" %}
{% block title %}Log in - myvinyl{% endblock %}
{% block content %}
<form class="narrow panel login" method="post" action="/login">
  <h1>Welcome back</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Username</label>
  <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" maxlength="64" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <div class="actions"><button type="submit">Log in</button></div>
  <p class="hint">No account? Ask the admin for an invite link.</p>
</form>
{% endblock %}
