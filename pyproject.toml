[project]
name = "myvinyl"
version = "0.6.1"
description = "A minimal self-hosted inventory for a vinyl record collection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "tzdata>=2024.1",
]

[project.scripts]
myvinyl = "myvinyl.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "F811"]  # F811: fixtures imported by name

[tool.pytest.ini_options]
testpaths = ["tests"]
